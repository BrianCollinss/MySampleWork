# Project-level settings used across the pipeline.
# Analysts will usually only need to update values in the `runtime` section.

project:
  name: procurement-risk-assurance-reporting
  log_level: INFO
  currency: AUD

runtime:
  # Root folder containing all raw source folders.
  # Each reporting run points to one subfolder inside this directory.
  raw_root_dir: data

  # Medallion layer output locations under each timestamped run folder.
  # These are resolved under: outputs/<timestamp> - <organisation>/data/
  bronze_dir: 1_bronze
  silver_dir: 2_silver
  gold_dir: 3_gold

  # Number of rows to sample from each file when inferring schema.
  # Increase this if source files have messy headings or mixed datatypes.
  schema_sample_rows: 100

  # Human-readable name of the organisation or reporting entity.
  # This is used in report headers, executive summaries, and output run-folder names.
  organisation_name: Griffith University

  # Month used as the start of the financial year.
  # For Australian public-sector reporting, July is usually appropriate.
  financial_year_start_month: 7

  # Default source folder used when the analyst runs:
  #   python -m src.main
  # without supplying --raw-folder.
  # The folder must exist under raw_root_dir.
  default_raw_folder: Griffith University Contract Disclosure Report

  # Optional filename patterns to exclude from ingestion.
  # Useful for demos, temporary files, exports, or duplicates you do not
  # want included in Bronze/Silver/Gold outputs.
  excluded_file_patterns:
    - "*_demo.csv"
    - "*demo*.csv"

# Fields treated as critical for governance and data quality checks.
# Missing values in these fields affect validation outputs and quality scoring.
critical_fields:
  - source_agency
  - contract_id
  - supplier_name
  - contract_value
  - contract_start_date

# Target Silver-layer schema.
# Source columns from different files are matched into these canonical fields.
canonical_contract_schema:
  - source_file
  - source_folder
  - source_agency
  - contract_id
  - supplier_name
  - supplier_abn
  - contract_title
  - procurement_category
  - procurement_method
  - contract_start_date
  - contract_end_date
  - contract_value
  - reporting_period
  - publish_date

# Known aliases used to standardise source schemas.
# Add new aliases here when a new agency/jurisdiction uses different headings.
schema_mappings:
  source_agency:
