# Azure ML Command Component: Spark Model Training
#
# This component defines the distributed training step of a machine learning
# pipeline using Apache Spark MLlib within Azure Machine Learning.
#
# The component runs a Spark-based Python training script that reads the input
# dataset, trains a model using Spark ML libraries and writes the resulting
# model artefacts to an output directory.
#
# It is intended for scalable training workloads on large datasets using
# Spark clusters and can be reused across different Azure ML pipelines.
#
# Inputs:
# - input_data: path to the dataset used for training
# - target_column: column used as the prediction target
#
# Outputs:
# - train_output_dir: directory containing the trained Spark model artefacts


$schema: https://azuremlschemas.azureedge.net/latest/commandComponent.schema.json
name: train_spark_model
display_name: Train Spark MLlib Model
type: command

inputs:
  input_data:
    type: uri_file
  target_column:
    type: string

outputs:
  train_output_dir:
    type: uri_folder

code: ../src

command: >-
  python 1.4.train_spark.py
  --input_data ${{inputs.input_data}}
  --target_column ${{inputs.target_column}}
  --train_output_dir ${{outputs.train_output_dir}}

environment: azureml:spark-py-3.3:1