# Azure ML Command Component: Spark Batch Scoring
#
# This component performs batch scoring for a Spark MLlib model. It takes a
# registered model directory and input data, runs batch inference, and writes
# scored results to an output folder for downstream consumption.
#
# Inputs:
# - model_dir: directory containing the trained Spark model artifacts
# - input_data: input dataset file used for scoring
#
# Outputs:
# - scored_output: directory containing batch scoring outputs

$schema: https://azuremlschemas.azureedge.net/latest/commandComponent.schema.json
name: batch_score_spark_model
display_name: Batch Score Spark MLlib Model
type: command

inputs:
  model_dir:
    type: uri_folder
  input_data:
    type: uri_file

outputs:
  scored_output:
    type: uri_folder

code: ../src

command: >-
  python 2.1.deploy_spark_batch.py
  --model_dir ${{inputs.model_dir}}
  --input_data ${{inputs.input_data}}
  --output_dir ${{outputs.scored_output}}

environment: azureml:spark-py-3.3:1
compute: azureml:spark-cluster
