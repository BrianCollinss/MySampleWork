# Azure ML Command Component: Model Evaluation
#
# This component defines the evaluation step of a regression model within an
# Azure Machine Learning pipeline. It runs a Python evaluation script that
# loads a previously trained model and assesses its performance using the
# provided dataset.
#
# The evaluation process typically computes metrics such as prediction error
# and validation scores, then stores the results as artefacts for downstream
# pipeline steps such as model registration or quality checks.
#
# Inputs:
# - train_output_dir: directory containing the trained model artefacts
# - input_data: dataset used to evaluate the trained model
# - target_column: column representing the prediction target
#
# Outputs:
# - eval_output_dir: directory containing evaluation metrics and results


$schema: https://azuremlschemas.azureedge.net/latest/commandComponent.schema.json
name: evaluate_regression_model
display_name: Evaluate Regression Model
type: command

inputs:
  train_output_dir:
    type: uri_folder
  input_data:
    type: uri_file
  target_column:
    type: string

outputs:
  eval_output_dir:
    type: uri_folder

code: ../src
command: >-
  python evaluate.py
  --train_output_dir ${{inputs.train_output_dir}}
  --input_data ${{inputs.input_data}}
  --target_column ${{inputs.target_column}}
  --eval_output_dir ${{outputs.eval_output_dir}}

environment: azureml:sklearn-1.0:1