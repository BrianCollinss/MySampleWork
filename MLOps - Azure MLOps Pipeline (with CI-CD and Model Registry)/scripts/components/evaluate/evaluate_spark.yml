# Azure ML Command Component: Spark Model Evaluation
#
# This component defines the evaluation step for a Spark MLlib model within an
# Azure Machine Learning pipeline. It executes a Spark-based Python script that
# loads a previously trained Spark model and evaluates its performance using
# the supplied dataset.
#
# The evaluation process typically computes model performance metrics and
# writes the results to an output directory, enabling downstream steps such as
# model validation, reporting or registration within an MLOps workflow.
#
# Inputs:
# - train_output_dir: directory containing the trained Spark model artefacts
# - input_data: dataset used for evaluating the trained model
# - target_column: column representing the prediction target
#
# Outputs:
# - eval_output_dir: directory containing evaluation metrics and result artefacts


$schema: https://azuremlschemas.azureedge.net/latest/commandComponent.schema.json
name: evaluate_spark_model
display_name: Evaluate Spark MLlib Model
type: command

inputs:
  train_output_dir:
    type: uri_folder
  input_data:
    type: uri_file
  target_column:
    type: string

outputs:
  eval_output_dir:
    type: uri_folder

code: ../src

command: >-
  python evaluate_spark.py
  --train_output_dir ${{inputs.train_output_dir}}
  --input_data ${{inputs.input_data}}
  --target_column ${{inputs.target_column}}
  --eval_output_dir ${{outputs.eval_output_dir}}

environment: azureml:spark-py-3.3:1