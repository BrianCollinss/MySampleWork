# Azure ML Command Component: Model Training
#
# This component defines the training step for a regression model within an
# Azure Machine Learning pipeline. It executes a Python training script that
# reads a prepared dataset, trains a regression model and stores the resulting
# model artefacts for downstream pipeline stages.
#
# The component is designed to be reusable across pipelines and accepts the
# dataset location and prediction target column as runtime inputs. The trained
# model is written to an output directory that can be consumed by evaluation,
# registration or deployment components in the ML workflow.
#
# Inputs:
# - input_data: path to the processed dataset used for training
# - target_column: column representing the prediction target
#
# Outputs:
# - train_output_dir: directory containing the trained model artefacts


$schema: https://azuremlschemas.azureedge.net/latest/commandComponent.schema.json
name: train_regression_model
display_name: Train Regression Model
type: command

inputs:
  input_data:
    type: uri_file
  target_column:
    type: string

outputs:
  train_output_dir:
    type: uri_folder

code: ../src
command: >-
  python train.py
  --input_data ${{inputs.input_data}}
  --target_column ${{inputs.target_column}}
  --train_output_dir ${{outputs.train_output_dir}}

environment: azureml:sklearn-1.0:1