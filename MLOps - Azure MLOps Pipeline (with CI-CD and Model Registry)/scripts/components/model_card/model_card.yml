# Azure ML Command Component: Model Card Generation
#
# This component generates a model card document using model metadata and an
# Azure OpenAI deployment. It is used as a documentation step in the MLOps
# workflow to produce standardized model reporting artifacts.
#
# Inputs:
# - metadata_path: path to a metadata file containing model context and metrics
# - openai_endpoint: Azure OpenAI endpoint URL
# - openai_deployment: Azure OpenAI deployment name
# - openai_api_key: Azure OpenAI API key
#
# Outputs:
# - model_card_output: directory containing generated model card artifacts

$schema: https://azuremlschemas.azureedge.net/latest/commandComponent.schema.json
name: generate_model_card
display_name: Generate Model Card with Azure OpenAI
type: command

inputs:
  metadata_path:
    type: uri_file
  openai_endpoint:
    type: string
  openai_deployment:
    type: string
  openai_api_key:
    type: string

outputs:
  model_card_output:
    type: uri_folder

code: ../src

command: >-
  python model_card.py
  --metadata_path ${{inputs.metadata_path}}
  --openai_endpoint ${{inputs.openai_endpoint}}
  --openai_deployment ${{inputs.openai_deployment}}
  --openai_api_key ${{inputs.openai_api_key}}
  --output_dir ${{outputs.model_card_output}}

environment: azureml:python-3.11-ubuntu:1
