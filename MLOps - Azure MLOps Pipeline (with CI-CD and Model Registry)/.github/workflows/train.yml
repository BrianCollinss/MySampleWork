# GitHub Actions Workflow: Train, Evaluate, and Register Model
#
# This workflow manually triggers the Azure ML training pipeline, waits for
# completion, and registers the resulting model in the Azure ML registry for
# downstream deployment steps.

name: train-evaluate-register

on:
  workflow_dispatch:

jobs:
  train_register:
    runs-on: ubuntu-latest

    env:
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_ML_WORKSPACE: ${{ vars.AZURE_ML_WORKSPACE }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Azure ML SDK
        run: |
          python -m pip install --upgrade pip
          pip install azure-ai-ml azure-identity

      - name: Submit pipeline, wait and register model
        run: |
          python scripts/pipelines/submit_pipeline.py
