# GitHub Actions Workflow: Continuous Integration (CI)
#
# This workflow validates code quality and test health for the repository.
# It runs on pushes and pull requests targeting main/master and executes
# linting, formatting, import-order checks, and unit tests with coverage upload.

name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov black flake8 isort

    - name: Lint with flake8
      run: |
        flake8 scripts/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 scripts/ tests/ --count --exit-zero --max-complexity=10 --max-line-length=88 --statistics

    - name: Format check with black
      run: black --check scripts/ tests/

    - name: Import sort check
      run: isort --check-only --profile black scripts/ tests/

    - name: Test with pytest
      run: |
        pytest --cov=scripts --cov-report=xml

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
