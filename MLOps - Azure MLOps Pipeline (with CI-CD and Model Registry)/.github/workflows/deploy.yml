# GitHub Actions Workflow: Model Deployment to Azure ML
#
# This workflow manually deploys a registered model to an Azure Machine
# Learning managed online endpoint. It supports deploying to a named slot
# such as staging or production and can optionally route all traffic to the
# new deployment.

name: deploy-model

on:
  workflow_dispatch:
  
    inputs:
      model_name:
        description: "Registered model name"
        required: true
        default: "house-price-regression"
      endpoint_name:
        description: "Endpoint name"
        required: true
        default: "house-price-endpoint"
      deployment_name:
        description: "Deployment name"
        required: true
        default: "staging"
      instance_type:
        description: "Azure ML instance type"
        required: true
        default: "Standard_DS3_v2"
      instance_count:
        description: "Number of instances"
        required: true
        default: "1"
      set_traffic:
        description: "Set 100% traffic to this deployment"
        required: true
        default: "false"

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_ML_WORKSPACE: ${{ vars.AZURE_ML_WORKSPACE }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Azure ML SDK
        run: |
          python -m pip install --upgrade pip
          pip install azure-ai-ml azure-identity

      - name: Deploy latest model
        run: |
          python src/deploy.py \
            --model_name "${{ github.event.inputs.model_name }}" \
            --endpoint_name "${{ github.event.inputs.endpoint_name }}" \
            --deployment_name "${{ github.event.inputs.deployment_name }}" \
            --instance_type "${{ github.event.inputs.instance_type }}" \
            --instance_count "${{ github.event.inputs.instance_count }}" \
            --set_traffic "${{ github.event.inputs.set_traffic }}" \
            --code_path "src" \
            --scoring_script "score.py" \
            --environment "azureml:sklearn-1.0:1" \
            --is_mlflow "false"
