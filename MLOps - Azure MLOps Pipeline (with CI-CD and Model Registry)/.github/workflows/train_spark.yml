# GitHub Actions Workflow: Spark Training Pipeline
#
# This workflow runs the Spark-based Azure ML training pipeline. It can be
# started manually or triggered by Spark-related file changes to keep Spark
# model training and evaluation automated.

name: train-spark-pipeline

on:
  workflow_dispatch:
  push:
    paths:
      - "src/*spark*"
      - "scripts/components/**/*spark*"
      - "scripts/pipelines/pipeline_spark.yml"
      - "scripts/pipelines/submit_pipeline_spark.py"

jobs:
  train_spark:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Azure ML SDK
        run: |
          pip install azure-ai-ml azure-identity

      - name: Submit Spark Pipeline
        env:
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_ML_WORKSPACE: ${{ vars.AZURE_ML_WORKSPACE }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: python scripts/pipelines/submit_pipeline_spark.py
