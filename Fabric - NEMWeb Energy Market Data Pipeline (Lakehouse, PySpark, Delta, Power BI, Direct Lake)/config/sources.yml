# AEMO NEMWeb source folders used by ingestion notebooks and smoke tests.
# Disabled entries document future expansion without being processed by default.
sources:
  - name: DispatchIS_Reports
    url: https://nemweb.com.au/Reports/Current/DispatchIS_Reports/
    market: NEM
    expected_update_frequency: 5 minutes
    enabled: true
    description: Near real-time dispatch interval price and demand reports.
    priority: 1
    notes: Primary source for current dashboard price and demand.
  - name: Public_Prices
    url: https://nemweb.com.au/Reports/Current/Public_Prices/
    market: NEM
    expected_update_frequency: 5 minutes
    enabled: true
    description: Public regional price reports.
    priority: 2
    notes: Used to validate and enrich price reporting.
  - name: PredispatchIS_Reports
    url: https://nemweb.com.au/Reports/Current/PredispatchIS_Reports/
    market: NEM
    expected_update_frequency: 30 minutes
    enabled: true
    description: Predispatch outlook reports.
    priority: 4
    notes: Required for forecast price and demand visuals.
  - name: Trading_Cumulative_Price
    url: https://nemweb.com.au/Reports/Current/Trading_Cumulative_Price/
    market: NEM
    expected_update_frequency: 5 minutes
    enabled: true
    description: Trading cumulative price reports.
    priority: 5
    notes: Required for cumulative price and administered price cap reporting.
  - name: Seven_Day_Outlook_Full
    url: https://nemweb.com.au/Reports/Current/SEVENDAYOUTLOOK_FULL/
    market: NEM
    expected_update_frequency: 30 minutes
    enabled: true
    description: Seven-day regional outlook reports.
    priority: 6
    notes: Required for scheduled demand, capacity, reserve, net interchange, and trading interval outlook visuals.
  - name: Next_Day_Dispatch
    url: https://nemweb.com.au/Reports/Current/Next_Day_Dispatch/
    market: NEM
    expected_update_frequency: daily
    enabled: true
    description: Next-day dispatch data.
    priority: 7
    notes: Required for next-day actual dispatch history and average price comparison views.
  - name: Dispatch_SCADA
    url: https://nemweb.com.au/Reports/Current/Dispatch_SCADA/
    market: NEM
    expected_update_frequency: 5 minutes
    enabled: true
    description: Unit-level dispatch SCADA generation data where available.
    priority: 3
    notes: Required for fuel mix and generation-by-fuel visuals after DUID fuel mapping is available.
  - name: Intermittent_Generation
    url: https://nemweb.com.au/Reports/Current/ROOFTOP_PV/ACTUAL/
    market: NEM
    expected_update_frequency: 30 minutes
    enabled: true
    description: Intermittent or rooftop generation-related current reports.
    priority: 8
    notes: Required for rooftop PV, renewable contribution, and renewable penetration visuals.
  - name: STTM
    url: https://nemweb.com.au/Reports/Current/STTM/
    market: Gas
    expected_update_frequency: daily
    enabled: false
    description: Short Term Trading Market gas placeholder.
    priority: 20
    notes: Future gas extension.
  - name: VicGas
    url: https://nemweb.com.au/Reports/Current/VicGas/
    market: Gas
    expected_update_frequency: daily
    enabled: false
    description: Victorian gas market placeholder.
    priority: 21
    notes: Future gas extension.
