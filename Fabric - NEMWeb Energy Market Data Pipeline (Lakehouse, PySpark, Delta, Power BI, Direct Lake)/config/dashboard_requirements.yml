# Business-facing dashboard requirements used to shape Gold tables and Power BI pages.
dashboard:
  regions: [QLD1, NSW1, VIC1, SA1, TAS1]
  interval_granularities: [5 minute, 30 minute, daily]
  features:
    - current and recent regional spot prices
    - regional operational demand
    - price and demand time series
    - regional comparison
    - scheduled or actual generation where available
    - generation mix by fuel type where derivable
    - interconnector flows
    - renewable contribution and renewable penetration where derivable
    - price spikes and volatility
    - daily max, min, and average prices
    - 30-minute and daily aggregations
    - current market snapshot
    - last successful ingestion timestamp
    - data freshness indicator
    - region slicers
    - time range slicers
    - interval granularity selector
